# 테스트와 타입 검사 (SPEC.md 16장 8-5).
# 엔진·계절·알림은 테스트로 지키기로 했으니, 올릴 때마다 여기서 한 번 더 돌린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      - name: 테스트
        run: pnpm test

      - name: 엔진 커버리지 100% (vitest.config.ts 의 thresholds 가 지킨다)
        run: pnpm --filter @multtae/mobile test:coverage
