# Edge Function 배포 자동화 (SPEC.md 16장 8-5).
# main 에 함수 코드가 올라가면 테스트를 돌린 뒤 바뀐 함수만 배포한다.
#
# 처음 한 번 저장소 Settings > Secrets and variables > Actions 에 넣어야 한다:
#   SUPABASE_ACCESS_TOKEN   https://supabase.com/dashboard/account/tokens 에서 만든 토큰
#   SUPABASE_PROJECT_REF    대시보드 주소의 프로젝트 ref (예: jddopglqjtrvwmzylrlk)
# 둘 중 하나라도 없으면 배포를 건너뛴다. 함수의 API 키(PLANTNET_API_KEY 같은 것)는
# 여기가 아니라 Supabase 의 Edge Function Secrets 에 있다 (CLAUDE.md 절대 규칙).
name: deploy-functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  # 손으로도 돌릴 수 있게
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 어떤 함수가 바뀌었는지 보려면 직전 커밋이 필요하다
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 공유 로직 테스트
        run: pnpm --filter @multtae/supabase test

      - name: 바뀐 함수 찾기
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            names=$(ls -d supabase/functions/*/ | xargs -n1 basename | grep -v '^_shared$' | tr '\n' ' ')
          else
            files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- supabase/functions || true)
            # _shared 가 바뀌면 모든 함수가 영향을 받는다
            if echo "$files" | grep -q 'supabase/functions/_shared/'; then
              names=$(ls -d supabase/functions/*/ | xargs -n1 basename | grep -v '^_shared$' | tr '\n' ' ')
            else
              names=$(echo "$files" | awk -F/ '/supabase\/functions\// {print $3}' | grep -v '^_shared$' | sort -u | tr '\n' ' ')
            fi
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "배포할 함수: ${names:-없음}"

      - name: 배포
        if: steps.changed.outputs.names != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "SUPABASE_ACCESS_TOKEN 또는 SUPABASE_PROJECT_REF 가 없어 배포를 건너뜁니다."
            exit 0
          fi
          for name in ${{ steps.changed.outputs.names }}; do
            echo "::group::$name"
            npx -y supabase@latest functions deploy "$name" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
